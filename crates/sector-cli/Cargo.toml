[package]
name = "sector-cli"
version.workspace = true
edition.workspace = true
description = "Command-line tools for SECTOR volumes: build, inspect, query, and run the falsification suite"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "sector"
path = "src/main.rs"

[dependencies]
sector-build.workspace = true
sector-sim.workspace = true
sector-format.workspace = true
sector-core.workspace = true
sector-codec.workspace = true
sector-quant.workspace = true
sector-hal.workspace = true
# `test-support` carries the volume-image builder that `selftest` uses. Enabled in
# the main dependency rather than duplicated here: three copies of an image
# builder — this crate's, sector-os's tests, and the daemon's — would drift.
sector-os = { workspace = true, features = ["test-support"] }
sector-serve.workspace = true

[dev-dependencies]
sector-os = { workspace = true, features = ["test-support", "mmap"] }
