[graph]
targets = [
    { triple = "riscv32imc-unknown-none-elf" },
    { triple = "thumbv7em-none-eabihf" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# The no_std family must stay dependency-free. A transitive `alloc` user here is
# a design defect, not a version-resolution nuisance.
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
