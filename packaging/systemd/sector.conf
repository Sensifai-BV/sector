# SECTOR daemon configuration. Read by sector.service as an EnvironmentFile.
#
# Installed to /etc/sector/sector.conf. Every value is required: the unit
# references all four, and systemd substitutes an empty string for an unset
# variable rather than failing, which would silently start the daemon with no
# --image argument.

# The volume to serve. Built by `sector build` on a host and copied here.
SECTOR_IMAGE=/var/lib/sector/volume.sector

# Unix socket path. Must live under /run/sector, which sector.service creates via
# RuntimeDirectory — a path elsewhere will fail to bind under ProtectSystem=strict.
SECTOR_SOCKET=/run/sector/sector.sock

# Worker threads. Each holds its own mounted volume and workspace, so resident
# memory is workers x the per-worker figure the daemon reports at startup and at
# GET /info.
#
# 1 is the right default and not a placeholder: on a Pi 1 or Zero it is the whole
# machine, and on a larger board the scan is CPU-bound integer work, so more
# workers buy concurrency at a directly proportional memory cost. Raise it only
# after reading the resident figure and checking it against the board's RAM.
SECTOR_WORKERS=1

# Default results per query when a request does not pass ?k=.
SECTOR_K=10

# --- Not set here, and why ---
#
# There is no SECTOR_LISTEN. A TCP listener is available (`--listen host:port`)
# but is not the packaged default: the daemon has no TLS and no authentication, so
# a port is only appropriate on a trusted network or behind a reverse proxy that
# terminates TLS. To use one, add --listen to ExecStart with a systemd drop-in
# (`systemctl edit sector`) rather than editing the shipped unit, and keep the
# port above 1024 so no capability is needed.
#
# There is no candidate-depth override. The volume's own R is what its recall was
# measured at; `--r` below it trades recall for latency silently, so it belongs in
# a deliberate `sector stats` comparison rather than in a config file.